name: mesh-gen-parallel

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        frame: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-sd15-cn-depth-v1
      - name: Install (pinned pair, same as verified locally)
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install diffusers==0.32.2 transformers==4.48.3 accelerate==1.3.0 safetensors pillow numpy
      - name: Build depth guide from mesh source
        run: python mesh-gen/make_guide.py --index ${{ matrix.frame }} --out guide/depth.png
      - name: Generate one frame (CPU, 512x512, 20 steps)
        run: python mesh-gen/generate_one.py --index ${{ matrix.frame }} --guide guide/depth.png --out-dir out
      - name: Upload frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: frame-${{ matrix.frame }}
          path: out/
